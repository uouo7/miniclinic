<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>掛號統計 - MiniClinic</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; max-width: 960px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #0F2443; border-bottom: 3px solid #14B8A6; padding-bottom: 8px; }
        nav { background: #0F2443; padding: 12px; border-radius: 8px; margin-bottom: 20px; }
        nav a { color: white; margin-right: 20px; text-decoration: none; font-weight: bold; }
        nav a:hover { color: #5EEAD4; }
        .cards { display: flex; gap: 16px; margin-top: 16px; }
        .card { background: #F8FAFC; padding: 12px 16px; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #E2E8F0; }
        th { background: #0F2443; color: white; }
    </style>
</head>
<body>
    <h1>掛號統計</h1>
    <nav>
        <a th:href="@{/}">首頁</a>
        <a th:href="@{/doctors}">醫師清單</a>
        <a th:href="@{/appointment/new}">線上掛號</a>
        <a th:href="@{/patients}">病歷資料</a>
        <a th:href="@{/appointments}">掛號紀錄</a>
        <a th:href="@{/stats}">統計資訊</a>
    </nav>

    <div class="cards">
        <div class="card"><strong>醫師總數：</strong> <span th:text="${doctorCount}">0</span></div>
        <div class="card"><strong>病患總數：</strong> <span th:text="${patientCount}">0</span></div>
        <div class="card"><strong>掛號總數：</strong> <span th:text="${appointmentCount}">0</span></div>
    </div>

    <h2>依科別分組的掛號數</h2>
    <p th:if="${apptByDept.isEmpty()}">目前沒有掛號資料。</p>
    <table th:unless="${apptByDept.isEmpty()}">
        <thead>
            <tr>
                <th>科別</th>
                <th>掛號數</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="entry : ${apptByDept}">
                <td th:text="${entry.key}">家庭醫學科</td>
                <td th:text="${entry.value}">0</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
